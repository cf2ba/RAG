<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>
    <button id = "btn">点击我发请求</button>
    <div id="content"></div>
    <script>
        btn = document.getElementById("btn")
        btn.onclick = async function(){
            res = await fetch("http://localhost:8000/sse03",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                },
                body:JSON.stringify({
                    query:"我是谁？",
                    session_id:"abc"
                })
            })
            data = await res.json()
            console.log(data)
            es = new EventSource("http://localhost:8000/stream/"+"abc")
            //on方式添加事件，前端都是系统事件才能这样添加
            //添加自定义事件可以
            es.addEventListener("process",function(e){
                console.log(e.data)
                document.getElementById("content").innerHTML += e.data + "<br/>"
            })
             es.addEventListener("final",function (e) {
                console.log(e.data)
                document.getElementById("content").innerHTML += e.data + "<br/>"
                es.close()
            })
            es.addEventListener("error",function (e) {
                console.log(e.data)
                document.getElementById("content").innerHTML += e.data + "<br/>"
                es.close()
            })

        }
    </script>

</body>
</html>
